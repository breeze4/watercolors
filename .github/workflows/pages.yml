name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Same content-derived stamp remote-bootstrap.sh applies on beebaby:
      # commit date + short SHA, so both hosts serving the same commit show
      # the same version and the in-app update nudge fires on real changes.
      - name: Stamp deploy version
        run: |
          stamp="v$(git log -1 --format=%cd --date=format:%Y-%m-%d).$(git rev-parse --short HEAD)"
          sed -E -i 's/(class="version-tag"[^>]*>)v[^<]*/\1'"$stamp"'/' index.html
          grep -q "$stamp" index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
